<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Lingkungan ESP8266</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; background: #f1f5f9; color: #0f172a; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .metric { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .metric-label { font-size: 14px; color: #475569; margin-bottom: 6px; }
    .metric-val { font-size: 26px; font-weight: bold; color: #0f172a; }
    .sub-note { font-size: 12px; color: #64748b; margin-top: 8px; }
    .online { color: #15803d; font-weight: bold; }
    .offline { color: #b91c1c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Monitoring Lingkungan ESP8266</h1>
    <p>Status Broker Web: <span id="conn-status" class="offline">Menghubungkan...</span></p>
    <p>Status Perangkat: <strong id="device-status" class="offline">Menunggu data...</strong></p>
    <p>Update Terakhir: <span id="last-update">-</span></p>
    <div class="sub-note">Interval pembaruan perangkat: setiap 1 detik • Deteksi offline otomatis: 5 detik tanpa data</div>
  </div>

  <div class="card">
    <h2>Data Sensor Real-Time</h2>
    <div class="grid">
      <div class="metric">
        <div class="metric-label">Suhu</div>
        <div class="metric-val" id="suhu-val">- °C</div>
      </div>
      <div class="metric">
        <div class="metric-label">Kelembapan</div>
        <div class="metric-val" id="lembab-val">- %</div>
      </div>
      <div class="metric">
        <div class="metric-label">Kebisingan</div>
        <div class="metric-val" id="bising-val">-</div>
      </div>
    </div>
  </div>

  <script>
    const TOPIC_STATUS = "hasbielektro-ui-2026/lingkungan/status";
    const TOPIC_DATA   = "hasbielektro-ui-2026/lingkungan/data";
    const STALE_LIMIT_MS = 5000;

    let lastPacketTime = 0;
    let lastReportedStatus = "Menunggu data...";

    function setDeviceStatusUI(text, isOnline) {
      const el = document.getElementById("device-status");
      el.textContent = text;
      el.className = isOnline ? "online" : "offline";
    }

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", () => {
      const el = document.getElementById("conn-status");
      el.textContent = "Terhubung";
      el.className = "online";
      client.subscribe([TOPIC_STATUS, TOPIC_DATA]);
    });

    client.on("message", (topic, message) => {
      const payload = message.toString();
      const now = Date.now();

      if (topic === TOPIC_STATUS) {
        lastReportedStatus = payload;
        const isOnline = payload.toUpperCase().startsWith("ONLINE");
        if (isOnline) lastPacketTime = now;
        setDeviceStatusUI(payload, isOnline);
      } else if (topic === TOPIC_DATA) {
        lastPacketTime = now;
        document.getElementById("last-update").textContent = new Date(now).toLocaleTimeString("id-ID");
        if (lastReportedStatus.toUpperCase().startsWith("ONLINE")) {
          setDeviceStatusUI(lastReportedStatus, true);
        }
        try {
          const d = JSON.parse(payload);
          document.getElementById("suhu-val").textContent = `${Number(d.suhu).toFixed(1)} °C`;
          document.getElementById("lembab-val").textContent = `${Number(d.kelembapan).toFixed(1)} %`;
          document.getElementById("bising-val").textContent = `${d.kebisingan}`;
        } catch (e) {
          document.getElementById("suhu-val").textContent = payload;
        }
      }
    });

    setInterval(() => {
      if (lastPacketTime > 0 && (Date.now() - lastPacketTime > STALE_LIMIT_MS)) {
        setDeviceStatusUI("OFFLINE (Tidak ada data baru)", false);
      }
    }, 1000);
  </script>
</body>
</html>
